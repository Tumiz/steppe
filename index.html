<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Steppe history on map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css" />
    <style>
        body { margin: 0; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; cursor: crosshair; }
        .leaflet-control-geocoder { width: 280px; }
        .speak-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 4px;
            padding: 2px 8px;
            font-size: 12px;
            border: 1px solid #999;
            border-radius: 4px;
            background: #f5f5f5;
            cursor: pointer;
            color: #333;
            line-height: 1.4;
        }
        .speak-btn:hover { background: #e0e0e0; }
        .speak-btn.playing { background: #ffcdd2; border-color: #e57373; color: #c62828; }
        .border-toggle {
            background: #fff;
            border: none;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            box-shadow: none;
            outline: none;
            border-radius: 3%;
        }
        .border-toggle:hover { background: #e0e0e0; }
        .border-toggle.active { background: #333; color: #fff; }
        .border-toggle.active:hover { background: #555; }
        .text-marker {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
            font-weight: bold;
            font-size: 20px;
            text-shadow:
                -0.5px -0.5px 0 #000,
                 0.5px -0.5px 0 #000,
                -0.5px  0.5px 0 #000,
                 0.5px  0.5px 0 #000;
            white-space: nowrap;
            text-align: center;
            line-height: 1.3;
            transform: translate(-50%, -50%);
        }
        .text-marker .time {
            font-size: 18px;
            font-weight: normal;
            opacity: 0.95;
        }
        .text-marker .lang {
            font-size: 15px;
            font-weight: normal;
            opacity: 0.95;
        }
        .text-marker .haplo {
            font-size: 14px;
            opacity: 0.95;
            font-weight: normal;
        }
        .site-marker {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
            font-weight: normal;
            font-size: 14px;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 1px 3px rgba(0,0,0,0.9);
            white-space: nowrap;
            text-align: center;
            transform: translate(-50%, 0);
        }
        .city-dot-marker {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
            font-weight: normal;
            font-size: 11px;
            color: #fff;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 1px 3px rgba(0,0,0,0.9);
            white-space: nowrap;
            text-align: center;
            transform: translate(-50%, 0);
        }
        #time-slider-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            padding: 6px 14px 4px;
            border-radius: 4px;
            width: 80%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0;
            font-size: 13px;
            color: #fff;
        }
        #time-slider-container label {
            text-align: center;
            padding-bottom: 2px;
        }
        #time-slider-ticks {
            position: relative;
            width: 100%;
            height: 18px;
        }
        .tick-label {
            position: absolute;
            font-size: 10px;
            top: 0;
            transform: translateX(-50%);
            white-space: nowrap;
            opacity: 0.85;
        }
        #time-slider-container input {
            width: 100%;
            cursor: pointer;
            box-sizing: border-box;
        }
        #temp-curve {
            width: 100%;
            height: 60px;
            display: block;
            margin-bottom: 1px;
            border-radius: 2px;
        }
        @media (max-width: 768px) {
            .leaflet-control-geocoder { width: 200px; }
            .border-toggle { padding: 8px 12px; font-size: 13px; }
            #time-slider-container { width: 92%; padding: 8px 12px 6px; }
            .tick-label { font-size: 9px; }
            .text-marker { font-size: 16px; }
            .text-marker .time { font-size: 14px; }
            .text-marker .haplo { font-size: 11px; }
            #temp-curve { height: 40px; }
        }
        @media (max-width: 480px) {
            .leaflet-control-geocoder { width: 160px; }
            .border-toggle { padding: 6px 10px; font-size: 11px; }
            #time-slider-container { width: 96%; padding: 6px 10px 4px; }
            .leaflet-control-zoom a { width: 28px; height: 28px; line-height: 28px; font-size: 14px; }
            #temp-curve { height: 36px; }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="time-slider-container">
        <label>Time: <span id="time-display">2000 BCE</span></label>
        <canvas id="temp-curve" width="800" height="60"></canvas>
        <div id="time-slider-ticks"></div>
        <input type="range" id="time-slider">
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <script>
        var map = L.map('map').setView([35, 105], 4);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© Esri'
        }).addTo(map);

        var cultureLabelPane = map.createPane('cultureLabelPane');
        cultureLabelPane.style.zIndex = 650;

        var bordersLayer;
        var cultureBordersLayer = L.layerGroup();
        var markersGroup = L.layerGroup().addTo(map);
        var siteLabelsLayer = L.layerGroup();
        var sitesDotsLayer = L.layerGroup();
        var searchableItems = [];
        var cultureItems = [];
        var movementItems = [];
        var riversLayer = L.layerGroup();
        var riversVisible = false;
        var movementsLayer = L.layerGroup().addTo(map);
        var movementsVisible = true;
        var riverDescs = {};
        var oldestYear = -Infinity;
        var newestYear = Infinity;
        function parseTimeRange(str) {
            if (!str) return null;
            var s = str.replace(/^c\.?\s*/i, '').trim();
            var parts = s.split(/[–\-]/);
            if (parts.length !== 2) return null;
            var start = parseInt(parts[0].trim());
            var end = parseInt(parts[1].trim().replace(/\s*BCE\s*$/, ''));
            if (isNaN(start) || isNaN(end)) return null;
            return { start: start, end: end };
        }

        window.speakText = function(text, btn) {
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                if (btn) btn.classList.remove('playing');
            }
            if (text) {
                var utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.85;
                utterance.pitch = 1.0;
                utterance.onend = function() { if (btn) btn.classList.remove('playing'); };
                utterance.onerror = function() { if (btn) btn.classList.remove('playing'); };
                window.speechSynthesis.speak(utterance);
                if (btn) btn.classList.add('playing');
            }
        };

        // Load local JSON markers
        fetch('cultures.json')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                function buildPopupContent(item) {
                    var desc = item.desc || '';
                    var speakBtn = '<button class="speak-btn" onclick="speakText(this.nextElementSibling.textContent, this)">\u25B6 Read aloud</button>';
                    var html = speakBtn + '<div style="display:none">' + desc.replace(/"/g, '&quot;') + '</div>';
                    html += '<b>' + item.name + '</b><br>' + desc;
                    if (item.language) {
                        html += '<br><b>Language:</b> ' + item.language;
                    }
                    if (item.haplogroups) {
                        html += '<br><b>Main Y-DNA haplogroups:</b> ' + item.haplogroups;
                    }
                    function fmtPaper(p) {
                        var t = p.title;
                        var m = t.match(/^(.+?)\s*\((\d{4})\)\s*(.+)/);
                        if (!m) return t;
                        var author = m[1].replace(/\s+et al\.?$/i, '').trim();
                        var year = m[2];
                        var name = m[3].trim().replace(/, .+/, '');
                        return author + ' [' + (p.org || '') + '] (' + year + ') ' + name;
                    }
                    if (item.papers && item.papers.length > 0) {
                        html += '<br><hr style="margin:4px 0"><b>Related papers:</b><br>';
                        item.papers.forEach(function(p) {
                            html += '• <a href="' + p.url + '" target="_blank" rel="noopener">' + fmtPaper(p) + '</a><br>';
                        });
                    }
                    return html;
                }

                data.forEach(function(item, idx) {
                    var color = item.color;
                    var isRiver = /\b(river|Bug)\b/i.test(item.name) || item.name === 'Yellow River (Huang He)' || item.name === 'Liao River' || item.name === 'Wei River';

                    if (isRiver) {
                        riverDescs[item.name] = item.desc || '';
                        return;
                    }

                    var parsed = parseTimeRange(item.time);
                    if (parsed) {
                        if (parsed.start > oldestYear) oldestYear = parsed.start;
                        if (parsed.end < newestYear) newestYear = parsed.end;
                    }

                    var icon = L.divIcon({
                        className: 'text-marker',
                        html: '<span style="color:' + color + '">' + item.name + '</span><br><span class="time" style="color:' + color + '">' + (item.time || '') + '</span>' + (item.language ? '<br><span class="lang" style="color:' + color + '">' + item.language + '</span>' : '') + (item.haplogroups ? '<br><span class="haplo" style="color:' + color + '">' + item.haplogroups + '</span>' : ''),
                        iconSize: null,
                        iconAnchor: [0, 0]
                    });
                    var marker = L.marker([item.lat, item.lng], { icon: icon, pane: 'cultureLabelPane' })
                        .addTo(markersGroup)
                        .bindPopup(buildPopupContent(item));
                    searchableItems.push({
                        name: item.name,
                        center: L.latLng(item.lat, item.lng),
                        type: 'culture',
                        marker: marker
                    });

                    var poly = null;
                    if (item.borders && item.borders.length > 0) {
                        poly = L.polygon(item.borders, {
                            color: color,
                            weight: 2,
                            opacity: 0.8,
                            fillColor: color,
                            fillOpacity: 0.12,
                            interactive: false
                        }).addTo(cultureBordersLayer);
                    }

                    var siteDotMarkers = [];
                    var siteLabelMarkers = [];
                    if (item.sites && item.sites.length > 0) {
                        item.sites.forEach(function(site) {
                            var siteMarker = L.circleMarker([site.lat, site.lng], {
                                radius: 6,
                                color: '#fff',
                                weight: 1.5,
                                fillColor: color,
                                fillOpacity: 0.85
                            }).addTo(sitesDotsLayer);
                            var siteDesc = site.desc || '';
                            var sitePopupHtml = '<button class="speak-btn" onclick="speakText(this.nextElementSibling.textContent, this)">\u25B6 Read aloud</button><div style="display:none">' + siteDesc.replace(/"/g, '&quot;') + '</div><b>' + site.name + '</b><br>' + siteDesc;
                            siteMarker.bindPopup(sitePopupHtml);
                            siteDotMarkers.push(siteMarker);
                            var siteIcon = L.divIcon({
                                className: 'site-marker',
                                html: '<span style="color:' + color + '">' + site.name + '</span>',
                                iconSize: null,
                                iconAnchor: [-10, 18]
                            });
                            var labelMarker = L.marker([site.lat, site.lng], { icon: siteIcon }).addTo(siteLabelsLayer);
                            labelMarker.bindPopup(sitePopupHtml);
                            siteLabelMarkers.push(labelMarker);
                            searchableItems.push({
                                name: site.name,
                                center: L.latLng(site.lat, site.lng),
                                type: 'site',
                                siteMarker: siteMarker
                            });
                        });
                    }

                    if (!isRiver) {
                        cultureItems.push({
                            startYear: parsed ? parsed.start : null,
                            endYear: parsed ? parsed.end : null,
                            marker: marker,
                            polygon: poly,
                            siteDots: siteDotMarkers,
                            siteLabels: siteLabelMarkers
                        });
                    }
                });

                // Render population movements as arrow polylines
                data.forEach(function(item) {
                    if (!item.movements || item.movements.length === 0) return;
                    var color = item.color || '#ff4444';
                    item.movements.forEach(function(mov) {
                        var from = mov.from;
                        var to = mov.to;
                        var midLat = (from[0] + to[0]) / 2;
                        var midLng = (from[1] + to[1]) / 2;
                        var dLat = to[0] - from[0];
                        var dLng = to[1] - from[1];
                        var dist = Math.sqrt(dLat * dLat + dLng * dLng);
                        var offset = dist * 0.1;
                        var curveLat = midLat - dLng / dist * offset;
                        var curveLng = midLng + dLat / dist * offset;

                        var line = L.polyline(
                            [[from[0], from[1]], [curveLat, curveLng], [to[0], to[1]]],
                            { color: color, weight: 3, opacity: 0.8 }
                        );
                        var popupHtml = '<b>' + item.name + '</b><br><i>' + mov.desc + '</i><br><small>' + mov.time + '</small>';
                        line.bindPopup(popupHtml);

                        var angle = Math.atan2(to[1] - curveLng, to[0] - curveLat) * 180 / Math.PI;
                        var arrowSize = 50;
                        var arrow1Lat = to[0] - arrowSize * 0.01 * Math.cos((angle - 30) * Math.PI / 180);
                        var arrow1Lng = to[1] - arrowSize * 0.01 * Math.sin((angle - 30) * Math.PI / 180);
                        var arrow2Lat = to[0] - arrowSize * 0.01 * Math.cos((angle + 30) * Math.PI / 180);
                        var arrow2Lng = to[1] - arrowSize * 0.01 * Math.sin((angle + 30) * Math.PI / 180);
                        var arrow = L.polyline(
                            [[arrow1Lat, arrow1Lng], [to[0], to[1]], [arrow2Lat, arrow2Lng]],
                            { color: color, weight: 4, opacity: 0.8 }
                        );

                        var movParsed = parseTimeRange(mov.time);
                        if (movParsed) {
                            if (movParsed.start > oldestYear) oldestYear = movParsed.start;
                            if (movParsed.end < newestYear) newestYear = movParsed.end;
                        }
                        movementItems.push({
                            startYear: movParsed ? movParsed.start : null,
                            endYear: movParsed ? movParsed.end : null,
                            line: line,
                            arrow: arrow
                        });

                        searchableItems.push({
                            name: item.name + ' migration',
                            center: L.latLng(midLat, midLng),
                            type: 'movement',
                            line: line
                        });
                    });
                });

                // Set up time slider
                var slider = document.getElementById('time-slider');
                var display = document.getElementById('time-display');
                var defaultYear = 2000;
                if (oldestYear > -Infinity && newestYear < Infinity) {
                    slider.min = -oldestYear;
                    slider.max = -newestYear;
                    slider.value = -Math.min(Math.max(defaultYear, newestYear), oldestYear);
                    display.textContent = (-slider.value) + ' BCE';

                    // Add period ticks
                    var tickMin = parseInt(slider.min);
                    var tickRange = parseInt(slider.max) - tickMin;
                    var rightEdge = parseInt(-slider.max);
                    var periods = [
                        { start: oldestYear, end: 3300, label: 'Neolithic' },
                        { start: 3300, end: 2600, label: 'Copper Age' },
                        { start: 2600, end: 800, label: 'Bronze Age' },
                        { start: 800, end: rightEdge, label: 'Iron Age' }
                    ];
                    var ticksEl = document.getElementById('time-slider-ticks');
                    for (var i = 0; i < periods.length; i++) {
                        var p = periods[i];
                        var mid = (p.start + p.end) / 2;
                        var pos = ((-mid) - tickMin) / tickRange * 100;
                        var span = document.createElement('span');
                        span.className = 'tick-label';
                        span.style.left = pos + '%';
                        span.textContent = p.label;
                        ticksEl.appendChild(span);
                    }
                }

                // Temperature proxy data (δ18O from GISP2 ice core, Alley 2000)
                var tempData = [
                    [5200,-34.8],[5100,-34.65],[5000,-34.55],[4900,-34.5],[4800,-34.4],
                    [4700,-34.35],[4600,-34.3],[4500,-34.3],[4400,-34.4],[4300,-34.5],
                    [4200,-34.6],[4100,-34.65],[4000,-34.6],[3900,-34.55],[3800,-34.65],
                    [3700,-34.75],[3600,-34.85],[3500,-34.95],[3400,-35.05],[3300,-35.1],
                    [3200,-35.15],[3100,-35.1],[3000,-35.05],[2900,-35.0],[2800,-34.95],
                    [2700,-35.0],[2600,-35.05],[2500,-35.0],[2400,-34.95],[2300,-35.0],
                    [2200,-35.05],[2100,-35.1],[2000,-35.15],[1900,-35.1],[1800,-35.05],
                    [1700,-35.0],[1600,-34.95],[1500,-34.9],[1400,-34.95],[1300,-34.9],
                    [1200,-34.85],[1100,-34.8],[1000,-34.75],[900,-34.7],[800,-34.65],
                    [700,-34.7],[600,-34.75],[500,-34.8],[400,-34.85],[300,-34.8],[200,-34.75]
                ];

                var canvas = document.getElementById('temp-curve');
                var ctx = canvas.getContext('2d');

                function drawTempCurve() {
                    // Match canvas pixel dimensions to display size
                    var rect = canvas.parentElement.getBoundingClientRect();
                    var w = Math.round(rect.width - 4);
                    var h = Math.round(canvas.clientHeight || 60);
                    if (canvas.width !== w) canvas.width = w;
                    if (canvas.height !== h) canvas.height = h;

                    var padL = 40, padR = 8, padT = 4, padB = 8;
                    var plotW = w - padL - padR;
                    var plotH = h - padT - padB;
                    if (plotW <= 0 || plotH <= 0) return;

                    var oldest = oldestYear > -Infinity ? oldestYear : 5200;
                    var newest = newestYear < Infinity ? newestYear : 200;
                    var tMin = -oldest, tMax = -newest;
                    var range = tMax - tMin || 1;

                    // Find data min/max
                    var dMin = Infinity, dMax = -Infinity;
                    for (var i = 0; i < tempData.length; i++) {
                        var v = tempData[i][1];
                        if (v < dMin) dMin = v;
                        if (v > dMax) dMax = v;
                    }
                    var dRange = dMax - dMin || 1;
                    var dMid = (dMin + dMax) / 2;

                    function xPos(year) { return padL + ((-year) - tMin) / range * plotW; }
                    function yPos(val) { return padT + (1 - (val - dMin) / dRange) * plotH; }

                    ctx.clearRect(0, 0, w, h);

                    // Gradient fill under curve
                    ctx.beginPath();
                    var firstX = xPos(tempData[0][0]);
                    ctx.moveTo(firstX, padT + plotH);
                    for (var i = 0; i < tempData.length; i++) {
                        ctx.lineTo(xPos(tempData[i][0]), yPos(tempData[i][1]));
                    }
                    var lastX = xPos(tempData[tempData.length-1][0]);
                    ctx.lineTo(lastX, padT + plotH);
                    ctx.closePath();

                    var grad = ctx.createLinearGradient(0, padT, 0, padT + plotH);
                    grad.addColorStop(0, 'rgba(255, 80, 40, 0.5)');
                    grad.addColorStop(0.5, 'rgba(255, 200, 80, 0.4)');
                    grad.addColorStop(1, 'rgba(60, 120, 255, 0.5)');
                    ctx.fillStyle = grad;
                    ctx.fill();

                    // Curve line
                    ctx.beginPath();
                    ctx.moveTo(firstX, yPos(tempData[0][1]));
                    for (var i = 1; i < tempData.length; i++) {
                        ctx.lineTo(xPos(tempData[i][0]), yPos(tempData[i][1]));
                    }
                    ctx.strokeStyle = '#ffcc55';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Labels
                    ctx.fillStyle = 'rgba(255,255,255,0.7)';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('Warm', padL - 4, padT + 4);
                    ctx.fillText('Cool', padL - 4, padT + plotH - 4);

                    // Y-axis line
                    ctx.beginPath();
                    ctx.moveTo(padL, padT);
                    ctx.lineTo(padL, padT + plotH);
                    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // Current position cursor
                    var curYear = -parseInt(slider.value);
                    if (curYear <= tempData[0][0] && curYear >= tempData[tempData.length-1][0]) {
                        var cx = xPos(curYear);
                        ctx.beginPath();
                        ctx.moveTo(cx, padT);
                        ctx.lineTo(cx, padT + plotH);
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // Interpolate value at current year
                        var val = 0;
                        for (var i = 0; i < tempData.length - 1; i++) {
                            if (curYear >= tempData[i+1][0] && curYear <= tempData[i][0]) {
                                var f = (curYear - tempData[i][0]) / (tempData[i+1][0] - tempData[i][0]);
                                val = tempData[i][1] + f * (tempData[i+1][1] - tempData[i][1]);
                                break;
                            }
                        }
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 10px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillText(val.toFixed(1) + '‰', cx, padT - 2);
                    }
                }

                drawTempCurve();
                window.addEventListener('resize', drawTempCurve);

                function applyTimeFilter(year) {
                    cultureItems.forEach(function(item) {
                        var t0 = item.startYear, t1 = item.endYear;
                        var visible = t0 !== null && t1 !== null && year <= t0 && year >= t1;

                        if (visible) {
                            if (!markersGroup.hasLayer(item.marker)) markersGroup.addLayer(item.marker);
                        } else {
                            if (markersGroup.hasLayer(item.marker)) markersGroup.removeLayer(item.marker);
                        }

                        if (item.polygon) {
                            if (visible) {
                                if (!cultureBordersLayer.hasLayer(item.polygon)) cultureBordersLayer.addLayer(item.polygon);
                            } else {
                                if (cultureBordersLayer.hasLayer(item.polygon)) cultureBordersLayer.removeLayer(item.polygon);
                            }
                        }

                        item.siteDots.forEach(function(dot) {
                            if (visible) {
                                if (!sitesDotsLayer.hasLayer(dot)) sitesDotsLayer.addLayer(dot);
                            } else {
                                if (sitesDotsLayer.hasLayer(dot)) sitesDotsLayer.removeLayer(dot);
                            }
                        });

                        item.siteLabels.forEach(function(label) {
                            if (visible) {
                                if (!siteLabelsLayer.hasLayer(label)) siteLabelsLayer.addLayer(label);
                            } else {
                                if (siteLabelsLayer.hasLayer(label)) siteLabelsLayer.removeLayer(label);
                            }
                        });
                    });

                    movementItems.forEach(function(item) {
                        var t0 = item.startYear, t1 = item.endYear;
                        var visible = t0 !== null && t1 !== null && year <= t0 && year >= t1;

                        if (visible) {
                            if (!movementsLayer.hasLayer(item.line)) movementsLayer.addLayer(item.line);
                            if (!movementsLayer.hasLayer(item.arrow)) movementsLayer.addLayer(item.arrow);
                        } else {
                            if (movementsLayer.hasLayer(item.line)) movementsLayer.removeLayer(item.line);
                            if (movementsLayer.hasLayer(item.arrow)) movementsLayer.removeLayer(item.arrow);
                        }
                    });
                }

                slider.addEventListener('input', function() {
                    var year = -parseInt(this.value);
                    display.textContent = year + ' BCE';
                    applyTimeFilter(year);
                    drawTempCurve();
                });

                applyTimeFilter(-parseInt(slider.value));
            })
            .catch(function() {});

        // Custom geocoder: search sites/cities/cultures first, fall back to Nominatim
        var markerGeocoder = {
            geocode: function(query, callback) {
                var results = [];
                var q = query.toLowerCase();
                for (var i = 0; i < searchableItems.length; i++) {
                    var item = searchableItems[i];
                    if (item.name.toLowerCase().indexOf(q) !== -1) {
                        results.push({
                            name: item.name,
                            center: item.center,
                            bbox: null,
                            source: item
                        });
                    }
                }
                if (results.length > 0) {
                    callback(results);
                } else {
                    L.Control.Geocoder.nominatim().geocode(query, callback);
                }
            }
        };

        L.Control.geocoder({
            geocoder: markerGeocoder,
            placeholder: 'Search',
            errorMessage: 'Not found',
            showResultIcons: true,
            collapsed: false,
            defaultMarkGeocode: false
        })
        .on('markgeocode', function(e) {
            var center = e.geocode.center;
            var source = e.geocode.source;
            map.setView(center, 12);
            if (source) {
                if (source.type === 'culture') {
                    source.marker.openPopup();
                    return;
                } else if (source.type === 'site') {
                    source.siteMarker.openPopup();
                    return;
                } else if (source.type === 'river-line') {
                    if (!riversVisible) {
                        riversVisible = true;
                        riversLayer.addTo(map);
                        var toggleBtns = document.querySelectorAll('.border-toggle');
                        toggleBtns.forEach(function(b) { if (b.innerHTML === 'Rivers') b.classList.add('active'); });
                    }
                    source.line.openPopup();
                    return;
                } else if (source.type === 'movement') {
                    source.line.openPopup();
                    return;
                }
            }
            L.popup()
                .setLatLng(center)
                .setContent(e.geocode.name)
                .openOn(map);
        })
        .addTo(map);

        // Country borders & features for reverse geocoding
        var countryFeatures = [];
        function pointInPolygon(lat, lng) {
            var pt = [lng, lat];
            for (var i = 0; i < countryFeatures.length; i++) {
                var feat = countryFeatures[i];
                var rings = feat.geometry.type === 'Polygon' ? [feat.geometry.coordinates] : feat.geometry.coordinates;
                for (var r = 0; r < rings.length; r++) {
                    var ring = rings[r][0];
                    var inside = false;
                    for (var k = 0, j = ring.length - 1; k < ring.length; j = k++) {
                        var xi = ring[k][0], yi = ring[k][1];
                        var xj = ring[j][0], yj = ring[j][1];
                        if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) {
                            inside = !inside;
                        }
                    }
                    if (inside) return feat.properties.name;
                }
            }
            return null;
        }
        fetch('https://unpkg.com/world-atlas@2.0.2/countries-110m.json')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var borders = topojson.mesh(data, data.objects.countries, function(a, b) { return a !== b; });
                bordersLayer = L.geoJSON(borders, {
                    style: {
                        color: '#fff',
                        weight: 1.5,
                        opacity: 0.8,
                        fill: false
                    }
                }).addTo(map);
                countryFeatures = topojson.feature(data, data.objects.countries).features;
            });

        // Load river polylines
        fetch('rivers.json')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                data.features.forEach(function(feature) {
                    var coords = feature.geometry.coordinates;
                    var latlngs = coords.map(function(c) { return [c[1], c[0]]; });
                    var name = feature.properties.name;
                    var color = feature.properties.color || '#3B9BD6';
                    var desc = riverDescs[name] || '';
                    var popupHtml = '<b>' + name + '</b>';
                    if (desc) popupHtml += '<br>' + desc;
                    var line = L.polyline(latlngs, {
                        color: color,
                        weight: 3,
                        opacity: 0.8,
                        interactive: true
                    }).bindPopup(popupHtml);
                    riversLayer.addLayer(line);
                    searchableItems.push({
                        name: name,
                        center: line.getBounds().getCenter(),
                        type: 'river-line',
                        line: line
                    });
                });
            })
            .catch(function() {});

        // Toggle country borders button
        var bordersVisible = true;
        var ToggleBorders = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function() {
                var btn = L.DomUtil.create('button', 'border-toggle active');
                btn.innerHTML = 'Country Border';
                L.DomEvent.disableClickPropagation(btn);
                L.DomEvent.on(btn, 'click', function() {
                    bordersVisible = !bordersVisible;
                    if (bordersLayer) {
                        if (bordersVisible) {
                            bordersLayer.addTo(map);
                            btn.classList.add('active');
                        } else {
                            map.removeLayer(bordersLayer);
                            btn.classList.remove('active');
                        }
                    }
                });
                return btn;
            }
        });
        map.addControl(new ToggleBorders());

        // Culture borders shown by default
        var cultureBordersVisible = true;
        cultureBordersLayer.addTo(map);

        // Toggle key sites (dots + names) button
        var keySitesVisible = false;
        var ToggleKeySites = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function() {
                var btn = L.DomUtil.create('button', 'border-toggle');
                btn.innerHTML = 'Key Sites';
                L.DomEvent.disableClickPropagation(btn);
                L.DomEvent.on(btn, 'click', function() {
                    keySitesVisible = !keySitesVisible;
                    if (keySitesVisible) {
                        sitesDotsLayer.addTo(map);
                        siteLabelsLayer.addTo(map);
                        btn.classList.add('active');
                    } else {
                        map.removeLayer(sitesDotsLayer);
                        map.removeLayer(siteLabelsLayer);
                        btn.classList.remove('active');
                    }
                });
                return btn;
            }
        });
        map.addControl(new ToggleKeySites());

        // Toggle modern cities button
        var citiesVisible = false;
        var ToggleCities = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function() {
                var btn = L.DomUtil.create('button', 'border-toggle');
                btn.innerHTML = 'Modern Cities';
                L.DomEvent.disableClickPropagation(btn);
                L.DomEvent.on(btn, 'click', function() {
                    citiesVisible = !citiesVisible;
                    if (citiesVisible) {
                        citiesLayer.addTo(map);
                        btn.classList.add('active');
                    } else {
                        map.removeLayer(citiesLayer);
                        btn.classList.remove('active');
                    }
                });
                return btn;
            }
        });
        map.addControl(new ToggleCities());

        // Toggle rivers button
        var ToggleRivers = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function() {
                var btn = L.DomUtil.create('button', 'border-toggle');
                btn.innerHTML = 'Rivers';
                L.DomEvent.disableClickPropagation(btn);
                L.DomEvent.on(btn, 'click', function() {
                    riversVisible = !riversVisible;
                    if (riversVisible) {
                        riversLayer.addTo(map);
                        btn.classList.add('active');
                    } else {
                        map.removeLayer(riversLayer);
                        btn.classList.remove('active');
                    }
                });
                return btn;
            }
        });
        map.addControl(new ToggleRivers());

        // Load city dataset for client-side reverse geocoding
        var citiesData = [];
        var citiesLayer = L.layerGroup();
        var citiesLabelsLayer = L.layerGroup();
        fetch('cities.json')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                citiesData = data;
                data.forEach(function(city) {
                    searchableItems.push({
                        name: city.name + (city.country ? ', ' + city.country : ''),
                        center: L.latLng(city.lat, city.lng),
                        type: 'city'
                    });
                    var dot = L.circleMarker([city.lat, city.lng], {
                        radius: 4,
                        color: '#000',
                        weight: 1.5,
                        fillColor: 'white',
                        fillOpacity: 0.9
                    }).bindPopup('<b>' + city.name + '</b><br>' + (city.state || '') + (city.state && city.country ? '<br>' : '') + (city.country || ''));
                    citiesLayer.addLayer(dot);
                    var label = L.divIcon({
                        className: 'city-dot-marker',
                        html: city.name,
                        iconSize: null,
                        iconAnchor: [-10, 16]
                    });
                    L.marker([city.lat, city.lng], { icon: label, interactive: false }).addTo(citiesLabelsLayer);
                });
                citiesLayer.addLayer(citiesLabelsLayer);
                if (citiesVisible) citiesLayer.addTo(map);
            })
            .catch(function() {});

        function haversineKm(lat1, lon1, lat2, lon2) {
            var R = 6371;
            var dLat = (lat2 - lat1) * Math.PI / 180;
            var dLon = (lon2 - lon1) * Math.PI / 180;
            var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function nearestCity(lat, lng) {
            var closest = null, minDist = Infinity;
            for (var i = 0; i < citiesData.length; i++) {
                var d = haversineKm(lat, lng, citiesData[i].lat, citiesData[i].lng);
                if (d < minDist) { minDist = d; closest = citiesData[i]; }
            }
            return { city: closest, distKm: Math.round(minDist) };
        }

        // Click on map to reverse-geocode
        var popup = L.popup({ closeButton: true, maxWidth: 300 });
        map.on('click', function(e) {
            var lat = e.latlng.lat, lng = e.latlng.lng;
            var result = nearestCity(lat, lng);
            var country = countryFeatures.length > 0 ? pointInPolygon(lat, lng) : null;
            if (!country && result.city) country = result.city.country;
            var html = '';
            if (result.city && result.distKm < 200) {
                html = '<b>' + result.city.name + '</b>';
                if (result.city.state) html += '<br>' + result.city.state;
                if (country) html += '<br>' + country;
                html += '<br><small>' + result.distKm + ' km away</small>';
            } else {
                html = country ? '<b>' + country + '</b>' : '<i>Open area</i>';
            }
            html += '<hr style="margin:4px 0"><small>' + lat.toFixed(4) + ', ' + lng.toFixed(4) + '</small>';
            popup.setLatLng(e.latlng).setContent(html).openOn(map);
        });

        // Visitor counter
        var VisitorControl = L.Control.extend({
            options: { position: 'bottomleft' },
            onAdd: function() {
                var div = L.DomUtil.create('div', 'visitor-counter');
                div.innerHTML = '<span id="fc-46272"></span>';
                return div;
            }
        });
        map.addControl(new VisitorControl());

        var fcr = Math.floor(Math.random()*99999999999);
        var _fcc = _fcc || []; _fcc.push(["46272"]); _fcc.push(["mint"]);
        (function(){
            var fc = document.createElement("script"); fc.async = true;
            fc.src = "https://www.imcounter.com/fcount.php?rnd=" + fcr;
            var sc = document.getElementById("fc-46272");
            sc.appendChild(fc);
        })();
    </script>
